name: Deploy Demo Branch to Hostinger

on:
  push:
    branches:
      - demo

jobs:
  deploy:
    name: Deploy Demo Branch
    runs-on: ubuntu-latest
    env:
      ACTIONS_RUNNER_DEBUG: true
      ACTIONS_STEP_DEBUG: true

    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, bcmath, ctype, json, tokenizer, curl, pdo, pdo_mysql
          coverage: none

      # Step 3: Install Composer dependencies
      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --ignore-platform-reqs

      # Step 4: Install sshpass
      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass || { echo "Failed to install sshpass"; exit 1; }
          sshpass -v || { echo "sshpass not found after installation"; exit 1; }

      # Step 5: Test SSH Connection
      - name: Test SSH Connection
        timeout-minutes: 5
        run: |
          echo "🔍 Testing network connectivity..."
          echo "Server: ${{ secrets.FTP_SERVER }}"
          echo "Port: 65002"
          echo "Username: ${{ secrets.FTP_USERNAME }}"
          
          # Test basic connectivity
          echo "📡 Testing port connectivity..."
          timeout 10 bash -c "</dev/tcp/${{ secrets.FTP_SERVER }}/65002" && echo "✓ Port 65002 is reachable" || echo "✗ Port 65002 is not reachable"
          
          # Test DNS resolution
          echo "🌐 Testing DNS resolution..."
          nslookup ${{ secrets.FTP_SERVER }} || dig ${{ secrets.FTP_SERVER }} || echo "⚠ DNS resolution test failed"
          
          # Test SSH connection with verbose output and timeout
          echo "🔐 Testing SSH connection..."
          sshpass -p "${{ secrets.FTP_PASSWORD }}" ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=60 \
            -o ServerAliveCountMax=3 \
            -v \
            -p 65002 \
            ${{ secrets.FTP_USERNAME }}@${{ secrets.FTP_SERVER }} \
            "whoami && echo 'SSH connection successful'"
          
          echo "✅ Running additional test command..."
          sshpass -p "${{ secrets.FTP_PASSWORD }}" ssh \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            -p 65002 \
            ${{ secrets.FTP_USERNAME }}@${{ secrets.FTP_SERVER }} \
            "echo 'Test command execution' && ls -la /home/u242329769/domains/vendor.kashtre.com/public_html"

      # Step 6: Deploy to Hostinger via SSH
      - name: Deploy to Hostinger
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          # Define deployment directory
          DEPLOY_DIR="/home/u242329769/domains/vendor.kashtre.com/public_html"

          # Debug: List local files in GITHUB_WORKSPACE
          echo "Local files in GITHUB_WORKSPACE:"
          ls -la $GITHUB_WORKSPACE

          # Copy files using rsync with sshpass, excluding sensitive files
          sshpass -p "$FTP_PASSWORD" rsync -avz \
            --exclude '.env' \
            --exclude '.htaccess' \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude 'vendor' \
            --exclude 'storage/logs/*' \
            --exclude 'storage/framework/cache/*' \
            --exclude 'storage/framework/sessions/*' \
            --exclude 'storage/framework/views/*' \
            -e "ssh -p 65002 -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=60 -o ServerAliveCountMax=3" \
            $GITHUB_WORKSPACE/ ${{ secrets.FTP_USERNAME }}@${{ secrets.FTP_SERVER }}:"$DEPLOY_DIR"

          # Step 1: Set permissions and create storage link
          sshpass -p "$FTP_PASSWORD" ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=60 -o ServerAliveCountMax=3 -p 65002 ${{ secrets.FTP_USERNAME }}@${{ secrets.FTP_SERVER }} "cd $DEPLOY_DIR && \
            echo '✓ Setting permissions...' && \
            chmod -R 755 storage bootstrap/cache 2>/dev/null || echo 'Warning: Could not set permissions' && \
            echo '✓ Removing existing storage link...' && \
            rm -f public/storage 2>/dev/null || true && \
            echo '✓ Creating storage link...' && \
            /usr/bin/php artisan storage:link 2>&1 || php artisan storage:link 2>&1 || echo 'Warning: Could not create storage link'"

          # Step 2: Install dependencies on server and run migrations
          sshpass -p "$FTP_PASSWORD" ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=60 -o ServerAliveCountMax=3 -p 65002 ${{ secrets.FTP_USERNAME }}@${{ secrets.FTP_SERVER }} "cd $DEPLOY_DIR && \
            echo '✓ Finding PHP path...' && \
            PHP_PATH=\$(which php || echo 'php') && \
            echo \"Using PHP: \$PHP_PATH\" && \
            \$PHP_PATH --version && \
            echo '✓ Installing Composer dependencies...' && \
            composer install --no-dev --optimize-autoloader --no-interaction --ignore-platform-reqs && \
            echo '✓ Checking migration status...' && \
            \$PHP_PATH artisan migrate:status && \
            echo '✓ Fixing duplicate medical_question_responses migration if needed...' && \
            \$PHP_PATH -r \"require 'vendor/autoload.php'; \\\$app = require_once 'bootstrap/app.php'; \\\$app->make('Illuminate\\\\Contracts\\\\Console\\\\Kernel')->bootstrap(); if (\\\\DB::table('migrations')->where('migration', '2026_01_27_084550_create_medical_question_responses_table')->doesntExist() && Schema::hasTable('medical_question_responses')) { \\\$batch = \\\\DB::table('migrations')->max('batch') ?? 0; \\\\DB::table('migrations')->insert(['migration' => '2026_01_27_084550_create_medical_question_responses_table', 'batch' => \\\$batch + 1]); echo 'Marked duplicate migration as run\n'; }\" 2>&1 || echo 'Could not fix duplicate migration (may not be needed)' && \
            echo '✓ Running migrations...' && \
            MIGRATION_OUTPUT=\$(\$PHP_PATH artisan migrate --force --verbose 2>&1) && \
            MIGRATION_EXIT=\$? && \
            echo \"\$MIGRATION_OUTPUT\" && \
            if [ \$MIGRATION_EXIT -eq 0 ]; then \
              echo '✓ Migrations completed successfully'; \
            elif echo \"\$MIGRATION_OUTPUT\" | grep -q \"already exists\"; then \
              echo '⚠ Migration failed due to existing table - attempting to mark as run...' && \
              \$PHP_PATH artisan migrate:status && \
              echo '⚠ Please manually fix duplicate migrations on server' && \
              exit 1; \
            else \
              echo '✗ Migration failed!'; \
              \$PHP_PATH artisan migrate:status; \
              exit 1; \
            fi && \
            echo '✓ Final migration status...' && \
            \$PHP_PATH artisan migrate:status && \
            echo '✓ Clearing and caching...' && \
            \$PHP_PATH artisan optimize:clear && \
            \$PHP_PATH artisan view:clear && \
            \$PHP_PATH artisan config:cache && \
            \$PHP_PATH artisan route:cache && \
            echo '✓ Deployment completed successfully!'"
