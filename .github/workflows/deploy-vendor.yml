name: Deploy Vendor

on:
  push:
    branches:
      - main
      - demo

concurrency:
  group: deploy-vendor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS (root)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 187.124.117.169
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            BRANCH="${{ github.ref_name }}"
            echo "🚀 Deploying third-party from branch: ${BRANCH}"

            git config --global --add safe.directory /var/www/third-party

            cd /var/www/third-party

            git fetch origin
            git reset --hard "origin/${BRANCH}"

            if [ "${BRANCH}" = "demo" ] || [ "${BRANCH}" = "main" ]; then
              echo "🔧 Setting KASHTRE_API_URL to demo for ${BRANCH} deploy..."
              if grep -q "^KASHTRE_API_URL=" .env; then
                sed -i "s|^KASHTRE_API_URL=.*|KASHTRE_API_URL=https://demo.kashtre.com|" .env
              else
                echo "KASHTRE_API_URL=https://demo.kashtre.com" >> .env
              fi
            fi

            export COMPOSER_ALLOW_SUPERUSER=1
            echo "📦 Installing PHP dependencies..."
            composer install --no-dev --optimize-autoloader --no-interaction --ignore-platform-reqs

            echo "📦 Installing Node dependencies..."
            npm install --no-audit --no-fund

            echo "🏗 Building frontend..."
            npm run build

            chown -R www-data:www-data /var/www/third-party
            chmod -R 775 storage bootstrap/cache

            php artisan storage:link || true
            php artisan migrate --force

            php artisan optimize:clear

            php artisan config:cache
            php artisan route:cache
            # php artisan view:cache

            php artisan queue:restart || true

            systemctl restart php8.3-fpm
